[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asthma-aware-ml"
version = "0.1.0"
description = "Configurable residual U-Net for GEOS-CF downscaling experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
data = ["rasterio>=1.3"]

[tool.setuptools.packages.find]
include = ["asthma_aware*"]
